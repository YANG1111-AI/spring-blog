<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:with="title='评论管理',active='comments'">
<header th:replace="back/header::headerFragment(${title},${active})"></header>
<body class="fixed-left">
<div id="wrapper">
    <div th:replace="back/header::header-body"></div>
    <div class="content-page">
        <div class="content">
            <div class="container">
                <div class="row">
                    <div class="col-sm-12">
                        <h4 class="page-title">评论管理</h4>
                        <div id="success-message" class="alert alert-success" style="display: none;">
                            <i class="fa fa-check"></i> 操作成功！
                        </div>
                    </div>
                    <div class="col-md-12">
                        <div class="row">
                            <div class="col-md-8">
                                <div class="panel panel-default">
                                    <div class="panel-body">
                                        <h5 class="text-muted">评论统计</h5>
                                        <p class="m-b-0">
                                            <span class="text-primary">总评论数: <strong th:text="${comments.total}"></strong></span>
                                            <span class="m-l-15 text-success">当前页: <strong th:text="${comments.pageNum}"></strong>/<strong th:text="${comments.pages}"></strong></span>
                                        </p>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <table class="table table-striped table-bordered">
                            <thead>
                            <tr>
                                <th width="6%">ID</th>
                                <th width="10%">文章ID</th>
                                <th width="12%">作者</th>
                                <th width="35%">评论内容</th>
                                <th width="12%">发布时间</th>
                                <th width="10%">状态</th>
                                <th width="15%">操作</th>
                            </tr>
                            </thead>
                            <tbody>
                            <th:block th:each="comment : ${comments.list}">
                                <tr>
                                    <td th:text="${comment.id}"></td>
                                    <td>
                                        <a th:href="@{'/article/'+${comment.articleId}}" target="_blank" th:text="${comment.articleId}"></a>
                                    </td>
                                    <td th:text="${comment.author}"></td>
                                    <td th:text="${commons.excerpt(comment.content)}"></td>
                                    <td th:text="${commons.formatDate(comment.created)}"></td>
                                    <td>
                                        <span th:if="${comment.status == 'approved'}" class="label label-success">已审核</span>
                                        <span th:if="${comment.status == 'pending'}" class="label label-warning">待审核</span>
                                        <span th:if="${comment.status == 'rejected'}" class="label label-danger">已拒绝</span>
                                    </td>
                                    <td>
                                        <a th:href="@{'/admin/comment/edit/'+${comment.id}}" class="btn btn-primary btn-xs">
                                            <i class="fa fa-edit"></i> 编辑
                                        </a>
                                        <button class="btn btn-danger btn-xs" th:onclick="'deleteComment('+${comment.id}+')'">
                                            <i class="fa fa-trash"></i> 删除
                                        </button>
                                    </td>
                                </tr>
                            </th:block>
                            </tbody>
                        </table>
                        <div th:replace="comm/paging :: pageAdminNav(${comments})"></div>
                    </div>
                </div>
                <div th:replace="back/footer :: footer-content"></div>
            </div>
        </div>
    </div>
</div>
<div th:replace="back/footer :: footer"></div>
<script>
function deleteComment(id) {
    if (confirm('确定要删除这条评论吗？')) {
        $.ajax({
            url: '/admin/comment/delete/' + id,
            type: 'POST',
            success: function(result) {
                if (result && result.success) {
                    showSuccessMessage('评论删除成功！');
                    setTimeout(function() {
                        location.reload();
                    }, 1000);
                } else {
                    alert('删除失败！');
                }
            },
            error: function() {
                alert('删除失败！');
            }
        });
    }
}

function showSuccessMessage(message) {
    var successDiv = $('#success-message');
    successDiv.text(message);
    successDiv.show();
    setTimeout(function() {
        successDiv.fadeOut();
    }, 3000);
}

// Check for URL parameters to show success messages
$(document).ready(function() {
    var urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('success') === 'update') {
        showSuccessMessage('评论更新成功！');
    }
});
</script>
</body>
</html>
