<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:with="title='系统设置',active='setting'">
<header th:replace="back/header::headerFragment(${title},${active})"></header>
<body class="fixed-left">
<div id="wrapper">
    <div th:replace="back/header::header-body"></div>
    <div class="content-page">
        <div class="content">
            <div class="container">
                <div class="row">
                    <div class="col-sm-12">
                        <h4 class="page-title">系统设置</h4>
                    </div>
                    <div class="col-md-12">
                        <!-- 背景图容器 -->
                        <div class="settings-background-container">
                            <div class="settings-content-overlay">
                                <div class="settings-icon-section">
                                    <i class="fa fa-cogs settings-main-icon"></i>
                                    <h2 class="settings-title">系统设置中心</h2>
                                    <p class="settings-subtitle">配置和管理您的博客系统</p>
                                </div>
                                
                                <div class="settings-features">
                                    <div class="feature-item">
                                        <i class="fa fa-globe"></i>
                                        <h4>站点配置</h4>
                                        <p>设置网站标题、描述、关键词等基本信息</p>
                                    </div>
                                    <div class="feature-item">
                                        <i class="fa fa-users"></i>
                                        <h4>用户管理</h4>
                                        <p>管理用户权限、角色分配和账户设置</p>
                                    </div>
                                    <div class="feature-item">
                                        <i class="fa fa-envelope"></i>
                                        <h4>邮件配置</h4>
                                        <p>配置SMTP服务器，启用邮件通知功能</p>
                                    </div>
                                    <div class="feature-item">
                                        <i class="fa fa-shield-alt"></i>
                                        <h4>安全设置</h4>
                                        <p>配置安全策略、访问控制和数据保护</p>
                                    </div>
                                    <div class="feature-item">
                                        <i class="fa fa-database"></i>
                                        <h4>数据管理</h4>
                                        <p>数据备份、恢复和系统维护工具</p>
                                    </div>
                                    <div class="feature-item">
                                        <i class="fa fa-palette"></i>
                                        <h4>主题设置</h4>
                                        <p>自定义网站外观、颜色和布局样式</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:replace="back/footer :: footer-content"></div>
            </div>
        </div>
    </div>
</div>

<style>
.settings-background-container {
    min-height: 700px;
    background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 50%, #ff9ff3 100%);
    background-image: 
        radial-gradient(circle at 25% 25%, rgba(255, 255, 255, 0.2) 0%, transparent 50%),
        radial-gradient(circle at 75% 75%, rgba(255, 107, 107, 0.3) 0%, transparent 50%),
        linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.1) 50%, transparent 60%);
    border-radius: 15px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 25px 50px rgba(0,0,0,0.15);
}

.settings-background-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image: 
        url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.08'%3E%3Cpath d='M20 20c0 11.046-8.954 20-20 20v20h40V20H20zM0 0h20v20H0V0z'/%3E%3C/g%3E%3C/svg%3E");
    opacity: 0.4;
}

.settings-content-overlay {
    position: relative;
    z-index: 2;
    padding: 50px 30px;
    text-align: center;
    color: white;
}

.settings-icon-section {
    margin-bottom: 40px;
}

.settings-main-icon {
    font-size: 75px;
    color: rgba(255, 255, 255, 0.95);
    margin-bottom: 20px;
    text-shadow: 0 4px 12px rgba(0,0,0,0.3);
    animation: rotate 20s linear infinite;
}

@keyframes rotate {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
}

.settings-title {
    font-size: 2.4rem;
    font-weight: 300;
    margin-bottom: 15px;
    text-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

.settings-subtitle {
    font-size: 1.1rem;
    opacity: 0.9;
    margin-bottom: 0;
}

.settings-features {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 25px;
    margin-bottom: 40px;
    max-width: 1200px;
    margin-left: auto;
    margin-right: auto;
}

.feature-item {
    padding: 25px 20px;
    background: rgba(255, 255, 255, 0.12);
    border-radius: 12px;
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.25);
    transition: all 0.3s ease;
    text-align: center;
}

.feature-item:hover {
    transform: translateY(-8px) scale(1.02);
    box-shadow: 0 15px 35px rgba(0,0,0,0.25);
    background: rgba(255, 255, 255, 0.18);
}

.feature-item i {
    font-size: 2.2rem;
    margin-bottom: 15px;
    color: rgba(255, 255, 255, 0.95);
    display: block;
}

.feature-item h4 {
    font-size: 1.2rem;
    margin-bottom: 10px;
    color: white;
    font-weight: 500;
}

.feature-item p {
    font-size: 0.9rem;
    opacity: 0.85;
    line-height: 1.4;
    margin-bottom: 0;
}

.coming-soon-badge {
    display: inline-flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.25);
    padding: 15px 30px;
    border-radius: 30px;
    border: 1px solid rgba(255, 255, 255, 0.4);
    backdrop-filter: blur(15px);
    font-size: 1.05rem;
}

.coming-soon-badge i {
    margin-right: 10px;
    font-size: 1.2rem;
}

.coming-soon-badge span {
    font-weight: 500;
}

@media (max-width: 768px) {
    .settings-content-overlay {
        padding: 30px 15px;
    }
    
    .settings-title {
        font-size: 1.8rem;
    }
    
    .settings-features {
        grid-template-columns: 1fr;
        gap: 15px;
    }
    
    .feature-item {
        padding: 20px 15px;
    }
}
</style>

<div th:replace="back/footer :: footer"></div>
</body>
</html>
