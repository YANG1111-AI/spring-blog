<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:with="title='分类/标签管理',active='category'">
<header th:replace="back/header::headerFragment(${title},${active})"></header>
<body class="fixed-left">
<div id="wrapper">
    <div th:replace="back/header::header-body"></div>
    <div class="content-page">
        <div class="content">
            <div class="container">
                <div class="row">
                    <div class="col-sm-12">
                        <h4 class="page-title">分类/标签管理</h4>
                    </div>
                    <div class="col-md-12">
                        <!-- 背景图容器 -->
                        <div class="category-background-container">
                            <div class="category-content-overlay">
                                <div class="category-icon-section">
                                    <i class="fa fa-tags category-main-icon"></i>
                                    <h2 class="category-title">分类 & 标签管理</h2>
                                    <p class="category-subtitle">组织和管理您的博客内容分类</p>
                                </div>
                                
                                <div class="category-features">
                                    <div class="feature-item">
                                        <i class="fa fa-folder-open"></i>
                                        <h4>内容分类</h4>
                                        <p>创建和管理文章分类，让内容更有条理</p>
                                    </div>
                                    <div class="feature-item">
                                        <i class="fa fa-tag"></i>
                                        <h4>标签系统</h4>
                                        <p>使用标签为文章添加关键词，提升搜索体验</p>
                                    </div>
                                    <div class="feature-item">
                                        <i class="fa fa-chart-bar"></i>
                                        <h4>数据统计</h4>
                                        <p>查看分类和标签的使用情况统计</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div th:replace="back/footer :: footer-content"></div>
            </div>
        </div>
    </div>
</div>

<style>
.category-background-container {
    min-height: 600px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    background-image: 
        radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
        radial-gradient(circle at 80% 20%, rgba(255, 255, 255, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 40% 40%, rgba(120, 119, 198, 0.2) 0%, transparent 50%);
    border-radius: 15px;
    position: relative;
    overflow: hidden;
    box-shadow: 0 20px 40px rgba(0,0,0,0.1);
}

.category-background-container::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image: 
        url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.1'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    opacity: 0.3;
}

.category-content-overlay {
    position: relative;
    z-index: 2;
    padding: 60px 40px;
    text-align: center;
    color: white;
}

.category-icon-section {
    margin-bottom: 50px;
}

.category-main-icon {
    font-size: 80px;
    color: rgba(255, 255, 255, 0.9);
    margin-bottom: 20px;
    text-shadow: 0 4px 8px rgba(0,0,0,0.2);
}

.category-title {
    font-size: 2.5rem;
    font-weight: 300;
    margin-bottom: 15px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.2);
}

.category-subtitle {
    font-size: 1.2rem;
    opacity: 0.9;
    margin-bottom: 0;
}

.category-features {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    margin-bottom: 40px;
}

.feature-item {
    flex: 1;
    min-width: 250px;
    margin: 20px;
    padding: 30px 20px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    transition: transform 0.3s ease, box-shadow 0.3s ease;
}

.feature-item:hover {
    transform: translateY(-5px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
}

.feature-item i {
    font-size: 2.5rem;
    margin-bottom: 15px;
    color: rgba(255, 255, 255, 0.9);
}

.feature-item h4 {
    font-size: 1.3rem;
    margin-bottom: 10px;
    color: white;
}

.feature-item p {
    font-size: 0.95rem;
    opacity: 0.8;
    line-height: 1.5;
    margin-bottom: 0;
}

.coming-soon-badge {
    display: inline-flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.2);
    padding: 12px 25px;
    border-radius: 25px;
    border: 1px solid rgba(255, 255, 255, 0.3);
    backdrop-filter: blur(10px);
}

.coming-soon-badge i {
    margin-right: 8px;
    font-size: 1.1rem;
}

.coming-soon-badge span {
    font-weight: 500;
}

@media (max-width: 768px) {
    .category-content-overlay {
        padding: 40px 20px;
    }
    
    .category-title {
        font-size: 2rem;
    }
    
    .category-features {
        flex-direction: column;
    }
    
    .feature-item {
        min-width: auto;
        margin: 10px 0;
    }
}
</style>

<div th:replace="back/footer :: footer"></div>
</body>
</html>
