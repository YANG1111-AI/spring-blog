<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:with="title='用户管理',active='user'">
<header th:replace="back/header::headerFragment(${title},${active})"></header>
<body class="fixed-left">
<div id="wrapper">
    <div th:replace="back/header::header-body"></div>
    <div class="content-page">
        <div class="content">
            <div class="container">
                <div class="row">
                    <div class="col-sm-12">
                        <h4 class="page-title">用户管理</h4>
                    </div>
                    <div class="col-md-12">
                        <table class="table table-striped table-bordered">
                            <thead>
                            <tr>
                                <th width="10%">ID</th>
                                <th width="20%">用户名</th>
                                <th width="25%">邮箱</th>
                                <th width="15%">注册时间</th>
                                <th width="10%">状态</th>
                                <th width="20%">操作</th>
                            </tr>
                            </thead>
                            <tbody>
                            <th:block th:each="user : ${users.list}">
                                <tr th:id="${user.id}">
                                    <td th:text="${user.id}"></td>
                                    <td th:text="${user.username}"></td>
                                    <td th:text="${user.email}"></td>
                                    <td th:text="${commons.formatDate(user.created)}"></td>
                                    <td>
                                        <span th:if="${user.valid == 1}" class="badge badge-success">正常</span>
                                        <span th:if="${user.valid == 0}" class="badge badge-danger">禁用</span>
                                    </td>
                                    <td>
                                        <a th:href="@{'/admin/user/edit/'+${user.id}}"
                                           class="btn btn-primary btn-sm waves-effect waves-light m-b-5">
                                           <i class="fa fa-edit"></i> <span>编辑</span></a>
                                        
                                        <a href="javascript:void(0)" th:onclick="'toggleUser('+${user.id}+');'"
                                           class="btn btn-warning btn-sm waves-effect waves-light m-b-5">
                                            <i class="fa fa-toggle-on"></i> 
                                            <span th:text="${user.valid == 1} ? '禁用' : '启用'"></span>
                                        </a>
                                        
                                        <a href="javascript:void(0)" th:onclick="'deleteUser('+${user.id}+');'"
                                           th:if="${user.username != 'admin'}"
                                           class="btn btn-danger btn-sm waves-effect waves-light m-b-5">
                                            <i class="fa fa-trash-o"></i> <span>删除</span></a>
                                    </td>
                                </tr>
                            </th:block>
                            </tbody>
                        </table>
                        <div th:replace="comm/paging :: pageAdminNav(${users})"></div>
                    </div>
                </div>
                <div th:replace="back/footer :: footer-content"></div>
            </div>
        </div>
    </div>
</div>
<div th:replace="back/footer :: footer"></div>

<script type="text/javascript">
    /*<![CDATA[*/
    function deleteUser(id) {
        if(confirm('确定删除该用户吗？删除后无法恢复！')){
            $.ajax({
                type:'post',
                url : '/admin/user/delete/' + id,
                dataType: 'json',
                success: function (result) {
                    if (result && result.success) {
                        alert("用户删除成功");
                        window.location.reload();
                    } else {
                        alert(result.msg || '用户删除失败')
                    }
                },
                error: function(xhr, status, error) {
                    alert('删除失败: ' + error);
                }
            });
        }
    }
    
    function toggleUser(id) {
        if(confirm('确定要切换该用户的状态吗？')){
            $.ajax({
                type:'post',
                url : '/admin/user/toggle/' + id,
                dataType: 'json',
                success: function (result) {
                    if (result && result.success) {
                        alert("用户状态更新成功");
                        window.location.reload();
                    } else {
                        alert(result.msg || '状态更新失败')
                    }
                },
                error: function(xhr, status, error) {
                    alert('操作失败: ' + error);
                }
            });
        }
    }
    /*]]>*/
</script>
</body>
</html>
