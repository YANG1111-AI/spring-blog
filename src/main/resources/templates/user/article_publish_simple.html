<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>发布文章</title>
    <link th:href="@{/user/css/style.min.css}" rel="stylesheet"/>
    <link th:href="@{/assets/css/amazeui.min.css}" rel="stylesheet"/>
    <script th:src="@{/assets/js/jquery.min.js}"></script>
    <script th:src="@{/assets/js/amazeui.min.js}"></script>
    <!-- 引入公共编辑器样式 -->
    <div th:replace="comm/article_editor::editor-styles"></div>
    <style>
        body {
            background-color: #f5f5f5;
            font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        }
        .article-publish-container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }
        .article-publish-card {
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.1);
            padding: 30px;
        }
        .article-publish-header {
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 20px;
            margin-bottom: 30px;
        }
        .article-publish-header h2 {
            margin: 0;
            color: #333;
            font-size: 24px;
            font-weight: 600;
        }
        .article-publish-header p {
            margin: 10px 0 0 0;
            color: #666;
            font-size: 14px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }
        .form-group input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .form-group input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        .form-row {
            display: flex;
            gap: 20px;
        }
        .form-row .form-group {
            flex: 1;
        }
        .article-publish-actions {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
            display: flex;
            justify-content: flex-end;
            gap: 15px;
        }
        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        .btn-default {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }
        .btn-default:hover {
            background: #e8e8e8;
        }
        .tips-box {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 25px;
            border-radius: 4px;
        }
        .tips-box p {
            margin: 0;
            color: #555;
            font-size: 14px;
            line-height: 1.6;
        }
    </style>
</head>
<body>
<div th:replace="client/header::header('发布文章',null)"></div>
<div class="article-publish-container">
    <div class="article-publish-card">
        <div class="article-publish-header">
            <h2>发布新文章</h2>
            <p>分享您的知识和想法</p>
        </div>
        
        <div class="tips-box">
            <p>💡 提示：请填写文章标题和内容，标签和分类为可选。文章发布后可以在"我的文章"中查看和管理。</p>
        </div>
        
        <!-- 使用传统表单提交，避免CSRF问题 -->
        <form method="post" action="/user/article/publish" id="articleForm">
            
            <!-- 隐藏字段 -->
            <input type="hidden" name="allowComment" value="true"/>
            <input type="hidden" name="categories" value="默认分类"/>
            
            <div class="form-group">
                <label for="title">文章标题 <span style="color: red;">*</span></label>
                <input type="text" id="title" name="title" class="form-control" 
                       placeholder="请输入文章标题（必填）" required="required" maxlength="50"/>
            </div>
            
            <div class="form-group">
                <label for="tags">文章标签</label>
                <input name="tags" id="tags" type="text" class="form-control" 
                       placeholder="请输入标签，用逗号分隔"/>
            </div>
            
            <div class="form-group">
                <label for="content">文章内容 <span style="color: red;">*</span></label>
                <textarea id="content" name="content" class="form-control" 
                          placeholder="请输入文章内容（支持Markdown格式）" 
                          required="required" rows="15" style="width: 100%; min-height: 400px;"></textarea>
            </div>
            
            <div class="article-publish-actions">
                <a class="btn btn-default" th:href="@{/}">取消</a>
                <button type="submit" class="btn btn-primary">发布文章</button>
            </div>
        </form>
    </div>
</div>

<div th:replace="client/footer::footer"></div>

<script>
    // 简单的表单验证
    $('#articleForm').on('submit', function(e) {
        var title = $('#title').val().trim();
        var content = $('#content').val().trim();
        
        if (!title) {
            alert('请输入文章标题');
            e.preventDefault();
            return false;
        }
        
        if (title.length > 50) {
            alert('文章标题不能超过50个字符');
            e.preventDefault();
            return false;
        }
        
        if (!content) {
            alert('请输入文章内容');
            e.preventDefault();
            return false;
        }
        
        // 显示提交状态
        $(this).find('button[type="submit"]').text('发布中...').prop('disabled', true);
        return true;
    });
</script>
</body>
</html>
