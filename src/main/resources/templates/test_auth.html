<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5">
<head>
    <meta charset="UTF-8">
    <title>权限测试页面</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; color: #0c5460; }
        .admin-btn { background-color: #ff6b6b; color: white; padding: 10px 15px; text-decoration: none; border-radius: 4px; display: inline-block; margin: 10px 0; }
    </style>
</head>
<body>
    <h1>权限测试页面</h1>
    
    <div class="section info">
        <h2>认证状态检查</h2>
        <div sec:authorize="isAuthenticated()">
            <p>✓ 用户已登录</p>
            <p><strong>用户名:</strong> <span sec:authentication="name"></span></p>
            <p><strong>权限列表:</strong> <span sec:authentication="authorities"></span></p>
        </div>
        
        <div sec:authorize="isAnonymous()">
            <p>✗ 用户未登录</p>
            <p><a href="/login">点击登录</a></p>
        </div>
    </div>
    
    <div class="section">
        <h2>权限检查</h2>
        
        <div sec:authorize="hasRole('ADMIN')" class="success">
            <h3>✓ 用户具有ADMIN权限</h3>
            <p>admin按钮应该显示</p>
            <a href="/admin" class="admin-btn">后台管理</a>
        </div>
        
        <div sec:authorize="!hasRole('ADMIN')" class="error">
            <h3>✗ 用户没有ADMIN权限</h3>
            <p>admin按钮不会显示</p>
        </div>
        
        <div sec:authorize="hasRole('USER')" class="success">
            <h3>✓ 用户具有USER权限</h3>
        </div>
        
        <div sec:authorize="!hasRole('USER')" class="error">
            <h3>✗ 用户没有USER权限</h3>
        </div>
    </div>
    
    <div class="section">
        <h2>原始权限检查</h2>
        <div sec:authorize="hasAuthority('ROLE_ADMIN')" class="success">
            <h3>✓ 用户具有ROLE_ADMIN权限</h3>
        </div>
        
        <div sec:authorize="!hasAuthority('ROLE_ADMIN')" class="error">
            <h3>✗ 用户没有ROLE_ADMIN权限</h3>
        </div>
    </div>
    
    <div class="section info">
        <h2>导航测试</h2>
        <p><a href="/">返回首页</a></p>
        <p><a href="/login">登录页面</a></p>
        <p><a href="/admin">直接访问后台管理</a></p>
    </div>
</body>
</html>
