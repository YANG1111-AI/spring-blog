<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>CSRF Token测试</title>
    <!-- CSRF已在SecurityConfig中禁用 -->
    <!-- <meta th:name="_csrf" th:content="${_csrf.token}"/> -->
    <!-- <meta th:name="_csrf_header" th:content="${_csrf.headerName}"/> -->
    <script th:src="@{/assets/js/jquery.min.js}"></script>
</head>
<body>
    <h1>CSRF Token测试</h1>
    
    <div id="csrf-info">
        <p>CSRF已在SecurityConfig中禁用</p>
        <!-- <p>CSRF Token: <span id="csrf-token"></span></p> -->
        <!-- <p>CSRF Header: <span id="csrf-header"></span></p> -->
    </div>
    
    <button onclick="testCsrf()">测试CSRF Token</button>
    <button onclick="testAuth()">测试认证状态</button>
    
    <div id="result"></div>
    
    <script>
        $(document).ready(function() {
            // CSRF已禁用
            $('#csrf-token').text('CSRF已禁用');
            $('#csrf-header').text('CSRF已禁用');
        });
        
        function testCsrf() {
            $('#result').html('<p>CSRF已在SecurityConfig中禁用</p>');
        }
        
        function testAuth() {
            $.get('/api/test-auth', function(data) {
                $('#result').html('<p>认证状态: ' + data + '</p>');
            }).fail(function(xhr) {
                $('#result').html('<p>认证检查失败: ' + xhr.status + ' - ' + xhr.responseText + '</p>');
            });
            });
        }
    </script>
</body>
</html>
