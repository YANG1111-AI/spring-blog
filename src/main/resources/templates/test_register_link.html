<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>测试注册链接</title>
</head>
<body>
    <h1>测试注册链接</h1>
    <p><a href="/register">直接链接到注册页面</a></p>
    <p><a href="/login">返回登录页面</a></p>
    
    <script>
        // 检查是否有JavaScript错误
        console.log('页面加载完成');
        
        // 测试点击事件
        document.addEventListener('click', function(e) {
            console.log('点击了:', e.target);
            if (e.target.tagName === 'A') {
                console.log('点击了链接:', e.target.href);
            }
        });
    </script>
</body>
</html>
