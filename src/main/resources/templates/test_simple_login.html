<!DOCTYPE html>
<html>
<head>
    <title>简单登录测试</title>
</head>
<body>
    <h1>简单登录测试</h1>
    <form action="/login" method="post">
        <div>
            <label>用户名:</label>
            <input type="text" name="username" value="admin" required>
        </div>
        <div>
            <label>密码:</label>
            <input type="password" name="password" value="123456" required>
        </div>
        <div>
            <button type="submit">登录</button>
        </div>
    </form>
    
    <div>
        <a href="/">返回首页</a>
    </div>
</body>
</html></body>
</html>
