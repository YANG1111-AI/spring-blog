<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity5"
      th:fragment="header(title,keywords)">
<head>
    <meta charset="utf-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge, chrome=1"/>
    <meta name="renderer" content="webkit"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <meta http-equiv="Cache-Control" content="no-transform"/>
    <meta http-equiv="Cache-Control" content="no-siteapp"/>
    <link rel="shortcut icon" th:href="@{/user/img/bloglogo.jpg}"/>
    <link rel="apple-touch-icon" th:href="@{/user/img/apple-touch-icon.png}"/>
    <title><th:block th:text="${title ?: '首页'}"></th:block></title>
    <link th:href="@{/user/css/xcode.min.css}" rel="stylesheet"/>
    <link th:href="@{/user/css/style.min.css}" rel="stylesheet"/>
    <script th:src="@{/assets/js/jquery.min.js}"></script>
    <script th:src="@{/assets/js/amazeui.min.js}"></script>
    <link rel="stylesheet" th:href="@{/assets/css/amazeui.min.css}"/>
    <link rel="stylesheet" th:href="@{/assets/css/app.css}"/>
    <!--[if lt IE 9]>
    <script th:src="@{/back/js/html5shiv.js}"></script>
    <script th:src="@{/back/js/respond.min.js}"></script>
    <![endif]-->
    
    <!-- 登录提示功能 -->
    <script>
        function showLoginPrompt(action) {
            var message = '请您登录之后才可以进行' + action + '功能';
            if (confirm(message + '\n\n点击"确定"跳转到登录页面，点击"取消"继续浏览')) {
                window.location.href = '/login';
            }
        }
    </script>
    
    <style>
        /* 优化导航栏样式 */
        .navbar-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 0 20px;
            height: 60px; /* 设置导航栏高度 */
        }
        
        .navbar-menu {
            display: flex;
            align-items: center;
            flex: 1;
            justify-content: center;
        }
        
        .navbar-functions {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .header-info {
            color: #fff;
            text-decoration: none;
            padding: 8px 15px;
            border-radius: 4px;
            transition: all 0.3s;
            font-size: 14px;
            white-space: nowrap;
            margin: 0 2px;
            display: inline-block;
        }
        
        .header-info:hover {
            background-color: rgba(255, 255, 255, 0.15);
            color: #fff;
            text-decoration: none;
            transform: translateY(-1px);
        }
        
        /* 特殊按钮样式 */
        .header-info.login-btn {
            background-color: #007bff;
            border: 1px solid #007bff;
        }
        
        .header-info.register-btn {
            background-color: #28a745;
            border: 1px solid #28a745;
        }
        
        .header-info.publish-btn {
            background-color: #ffc107;
            color: #212529;
            border: 1px solid #ffc107;
        }
        
        .header-info.article-btn {
            background-color: #17a2b8;
            border: 1px solid #17a2b8;
        }
        
        .navbar-search {
            display: flex;
            align-items: center;
        }
        
        /* Logo样式优化 - 垂直居中 */
        .navbar-logo {
            transition: all 0.3s ease;
            cursor: pointer !important;
            pointer-events: auto !important;
            z-index: 999 !important;
            position: relative !important;
            /* 覆盖原有的绝对定位，使用flex居中 */
            position: static !important;
            margin: 0 !important;
            top: auto !important;
            left: auto !important;
            transform: none !important;
            display: flex !important;
            align-items: center !important;
            height: auto !important;
            line-height: normal !important;
        }
        
        .navbar-logo:hover {
            color: #f0f0f0 !important;
            text-decoration: none !important;
            opacity: 0.8;
        }
        
        /* 搜索框样式保持原样 */
        .search-box {
            margin-left: 10px;
        }
        
        .icon-search {
            margin-right: 5px;
        }
    </style>
</head>
<body  gtools_scp_screen_capture_injected="true" th:class="${is_post}?'':'bg-
'">
<!--[if lt IE 8]>
<div class="browsehappy" role="dialog">
    当前网页 <strong>不支持</strong> 你正在使用的浏览器. 为了正常的访问, 请 <a href="http://browsehappy.com/" target="_blank">升级你的浏览器</a>。
</div>
<![endif]-->
<header id="header" class="header bg-white">
    <div class="navbar-container">
        <a th:href="@{/}" class="navbar-logo" onclick="window.location.href='/'; return true;">zcy个人博客小站Blog</a>
        <div class="navbar-menu">
            <form name="logoutform" th:action="@{/logout}" method="post" style="display:inline;">
            </form>
            
            <!-- 功能按钮区域 - 始终显示所有按钮 -->
            <div class="navbar-functions">
                <!-- 登录和注册按钮（未登录时显示） -->
                <a class="header-info login-btn" sec:authorize="isAnonymous()" th:href="@{/login}">登录</a>
                <a class="header-info register-btn" sec:authorize="isAnonymous()" th:href="@{/register}">注册</a>
                
                <!-- 发布文章和我的文章按钮（始终显示） -->
                <!-- 未登录时点击会提示登录 -->
                <a class="header-info publish-btn" sec:authorize="isAnonymous()" href="javascript:void(0)" onclick="showLoginPrompt('发布文章')">发布文章</a>
                <a class="header-info article-btn" sec:authorize="isAnonymous()" href="javascript:void(0)" onclick="showLoginPrompt('管理文章')">我的文章</a>
                
                <!-- 已登录时的功能按钮 -->
                <a class="header-info publish-btn" sec:authorize="isAuthenticated()" th:href="@{/user/article/publish}">发布文章</a>
                <a class="header-info article-btn" sec:authorize="isAuthenticated()" th:href="@{/user/article/my}">我的文章</a>
                <a class="header-info" sec:authorize="isAuthenticated()" th:href="@{/user/profile}" style="background-color: #6f42c1; color: white;">个人中心</a>
                
                <!-- 已登录用户信息和退出 -->
                <span class="header-info" sec:authorize="isAuthenticated()" style="color: #ffd700; background-color: rgba(255, 215, 0, 0.2);">
                    欢迎，<span sec:authentication="name"></span>
                </span>
                
                <!-- 管理员专用功能 -->
                <a class="header-info" sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" style="background-color: #ff6b6b; color: white;">后台管理</a>
                
                <!-- 退出按钮 -->
                <a class="header-info" sec:authorize="isAuthenticated()" href="javascript:document.logoutform.submit();" style="background-color: #dc3545; color: white;">退出</a>
            </div>
        </div>
        <div class="navbar-search" onclick="">
            <!-- 搜索功能保持原位 -->
            <span class="icon-search"></span>
            <form role="search" onsubmit="return false;">
                <span class="search-box">
                    <input type="text" id="search-inp" class="input" placeholder="搜索..." maxlength="30"
                           autocomplete="off"/>
                </span>
            </form>
        </div>
    </div>
</header>
</body>
</html>
