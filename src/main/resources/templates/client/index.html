<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<!-- 载入文章头部页面，位置在/client文件夹下的header模板页面，模板名称th:fragment为header -->
<div th:replace="/client/header::header(null,null)" />
<body>
<div class="am-g am-g-fixed blog-fixed index-page">
    <div class="am-u-md-8 am-u-sm-12">
        <!-- 文章遍历并分页展示 -->
        <div th:each="article: ${articles.list}">
            <article class="am-g blog-entry-article">
                <div class="am-u-lg-6 am-u-md-12 am-u-sm-12 blog-entry-img">
                    <img width="100%" class="am-u-sm-12" th:src="@{${commons.show_thumb(article)}}"/>
                </div>
                <div class="am-u-lg-6 am-u-md-12 am-u-sm-12 blog-entry-text">
                    <!-- 文章分类 -->
                    <span class="blog-color"style="font-size: 15px;"><a>默认分类</a></span>
                    <span>&nbsp;&nbsp;&nbsp;</span>
                    <!-- 发布时间 -->
                    <span style="font-size: 15px;" th:text="'发布于 '+ ${commons.dateFormat(article.created)}" />
                    <h2>
                        <div><a style="color: #0f9ae0;font-size: 20px;" th:href="${commons.permalink(article.id)}" th:text="${article.title}" />
                        </div>
                    </h2>
                    <!-- 文章摘要-->
                    <div style="font-size: 16px;" th:utext="${commons.intro(article,75)}" />
                </div>
            </article>
        </div>
        <!-- 文章分页信息 -->
        <div class="am-pagination">
            <div th:replace="/comm/paging::pageNav(${articles},'上一页','下一页','page')" />
        </div>
    </div>
    <!-- 右侧边栏 -->
    <div class="am-u-md-4 am-u-sm-12 blog-sidebar">
        <!-- 博主信息描述 -->
        <div class="blog-sidebar-widget blog-bor">
            <h2 class="blog-text-center blog-title"><span>zcy</span></h2>
            <img th:src="@{/assets/img/me.jpg}" alt="about me" class="blog-entry-img"/>
            <p>Java后台开发</p>
            <p>个人博客小站，主要发表关于Java、Spring、Docker等相关文章</p>
        </div>
        
        <!-- 联系我 -->
        <div class="blog-sidebar-widget blog-bor">
            <h2 class="blog-text-center blog-title"><span>联系我</span></h2>
            <p>
                <a><span class="am-icon-github am-icon-fw blog-icon"></span></a>
                <a><span class="am-icon-weibo am-icon-fw blog-icon"></span></a>
            </p>
        </div>
        
        <!-- 阅读排行榜 -->
        <div class="blog-sidebar-widget blog-bor">
            <h2 class="blog-text-center blog-title"><span>阅读排行榜</span></h2>
            <div th:if="${articleList == null or articleList.size() == 0}">
                <p style="text-align: center; color: #999; padding: 20px;">
                    <i class="am-icon-info-circle"></i> 暂无文章数据
                </p>
            </div>
            <div th:if="${articleList != null and articleList.size() > 0}">
                <th:block th:each="article, articleStat : ${articleList}">
                    <div style="margin-bottom: 8px; padding: 6px; border-left: 3px solid #007bff; background-color: #f8f9fa;">
                        <div style="display: flex; align-items: center;">
                            <span th:class="${articleStat.index < 3} ? 'top-rank' : 'normal-rank'" 
                                  th:text="${articleStat.index + 1}" 
                                  style="font-weight: bold; margin-right: 8px; min-width: 20px;"></span>
                            <a th:href="@{'/article/' + ${article.id}}" 
                               th:text="${article.title}" 
                               style="font-size: 13px; color: #333; text-decoration: none; flex: 1; line-height: 1.3;">
                            </a>
                        </div>
                        <div style="margin-top: 3px; font-size: 11px; color: #666;">
                            <i class="am-icon-eye"></i> <span th:text="${article.hits != null ? article.hits : 0}">0</span> 次阅读
                            <span style="margin-left: 8px;">
                                <i class="am-icon-comment"></i> <span th:text="${article.commentsNum != null ? article.commentsNum : 0}">0</span> 评论
                            </span>
                        </div>
                    </div>
                </th:block>
            </div>
        </div>
    </div>
    
    <style>
        .top-rank {
            color: #ff6b6b !important;
            background-color: #ff6b6b;
            color: white !important;
            border-radius: 50%;
            width: 18px;
            height: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
        }
        
        .normal-rank {
            color: #007bff !important;
            font-size: 13px;
        }
        
        .blog-sidebar-widget a:hover {
            color: #007bff !important;
            text-decoration: underline !important;
        }
        
        /* 确保侧边栏不会过宽 */
        .blog-sidebar {
            max-width: 300px;
        }
        
        .blog-sidebar-widget {
            margin-bottom: 20px;
        }
    </style>
</div>
</body>
<!-- 载入文章尾部页面，位置在/client文件夹下的footer模板页面，模板名称th:fragment为footer -->
<div th:replace="/client/footer::footer" />
</html>
