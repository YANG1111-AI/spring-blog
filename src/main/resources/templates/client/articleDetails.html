<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <script th:src="@{/assets/js/jquery.min.js}"></script>
    <script th:src="@{/assets/js/layer.js}"></script>
    <style>
        .post-content img {
            max-width: 100%;
            height: auto;
            margin: 10px 0;
            border-radius: 5px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
        }
        .post-content pre {
            background-color: #f4f4f4;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
            margin: 15px 0;
        }
        .post-content code {
            font-family: 'Courier New', monospace;
            font-size: 14px;
        }
        .post-content strong {
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<div th:replace="client/header::header(${article.title},null)"></div>
<body>
<article class="main-content post-page">
    <div class="post-header">
        <h1 class="post-title" itemprop="name headline" th:text="${article.title}"></h1>
        <div class="post-data">
            <time th:datetime="${commons.formatDate(article.created)}" itemprop="datePublished" th:text="'发布于 '+ ${commons.formatDate(article.created)}"></time>
        </div>
    </div>
    <br />
    <div id="post-content" class="post-content content" th:utext="${commons.renderContent(article.content)}"></div>
    
    <!-- 文章互动区域 -->
    <div class="post-actions" style="margin: 30px 0; padding: 20px; background: #f8f9fa; border-radius: 8px;">
        <div class="action-buttons" style="display: flex; gap: 15px; align-items: center;">
            <!-- 点赞按钮 -->
            <button id="likeBtn" class="btn-action" style="background: none; border: 1px solid #ddd; padding: 8px 16px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                <i id="likeIcon" class="fa fa-heart-o" style="color: #666;"></i>
                <span id="likeText">点赞</span>
                <span id="likeCount" style="color: #666;">0</span>
            </button>
            
            <!-- 收藏按钮 -->
            <button id="favoriteBtn" class="btn-action" style="background: none; border: 1px solid #ddd; padding: 8px 16px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                <i id="favoriteIcon" class="fa fa-star-o" style="color: #666;"></i>
                <span id="favoriteText">收藏</span>
                <span id="favoriteCount" style="color: #666;">0</span>
            </button>
            
            <!-- 分享按钮 -->
            <button class="btn-action" onclick="shareArticle()" style="background: none; border: 1px solid #ddd; padding: 8px 16px; border-radius: 20px; cursor: pointer; display: flex; align-items: center; gap: 5px;">
                <i class="fa fa-share" style="color: #666;"></i>
                <span>分享</span>
            </button>
        </div>
    </div>
</article>
<div th:replace="client/comments::comments"></div>
<div th:replace="client/footer::footer"></div>
<!-- 使用layer.js实现图片缩放功能 -->
<script type="text/JavaScript">
    var articleId = [[${article.id}]];
    
    // 页面加载时获取点赞和收藏状态
    $(document).ready(function() {
        console.log('文章ID:', articleId);
        loadLikeStatus();
        loadFavoriteStatus();
    });
    
    // 获取点赞状态
    function loadLikeStatus() {
        $.get('/article/like/status/' + articleId, function(result) {
            if (result && result.success) {
                var data = result.data;
                var isLiked = data[0];
                var likesCount = data[1];
                
                $('#likeCount').text(likesCount);
                if (isLiked) {
                    $('#likeIcon').removeClass('fa-heart-o').addClass('fa-heart').css('color', '#e74c3c');
                    $('#likeText').text('已点赞');
                    $('#likeBtn').css('border-color', '#e74c3c');
                }
            }
        });
    }
    
    // 获取收藏状态
    function loadFavoriteStatus() {
        $.get('/article/favorite/status/' + articleId, function(result) {
            if (result && result.success) {
                var data = result.data;
                var isFavorited = data[0];
                var favoritesCount = data[1];
                
                $('#favoriteCount').text(favoritesCount);
                if (isFavorited) {
                    $('#favoriteIcon').removeClass('fa-star-o').addClass('fa-star').css('color', '#f39c12');
                    $('#favoriteText').text('已收藏');
                    $('#favoriteBtn').css('border-color', '#f39c12');
                }
            }
        });
    }
    
    // 点赞功能
    $('#likeBtn').click(function() {
        var isLiked = $('#likeIcon').hasClass('fa-heart');
        var url = isLiked ? '/article/unlike/' + articleId : '/article/like/' + articleId;
        
        $.post(url, function(result) {
            if (result && result.success) {
                var likesCount = result.data;
                $('#likeCount').text(likesCount);
                
                if (isLiked) {
                    // 取消点赞
                    $('#likeIcon').removeClass('fa-heart').addClass('fa-heart-o').css('color', '#666');
                    $('#likeText').text('点赞');
                    $('#likeBtn').css('border-color', '#ddd');
                } else {
                    // 点赞
                    $('#likeIcon').removeClass('fa-heart-o').addClass('fa-heart').css('color', '#e74c3c');
                    $('#likeText').text('已点赞');
                    $('#likeBtn').css('border-color', '#e74c3c');
                }
                
                layer.msg(result.msg, {icon: 1, time: 1500});
            } else {
                layer.msg(result.msg || '操作失败', {icon: 2, time: 2000});
            }
        }).fail(function() {
            layer.msg('网络错误，请稍后重试', {icon: 2, time: 2000});
        });
    });
    
    // 收藏功能
    $('#favoriteBtn').click(function() {
        var isFavorited = $('#favoriteIcon').hasClass('fa-star');
        var url = isFavorited ? '/article/unfavorite/' + articleId : '/article/favorite/' + articleId;
        
        $.post(url, function(result) {
            if (result && result.success) {
                var favoritesCount = result.data;
                $('#favoriteCount').text(favoritesCount);
                
                if (isFavorited) {
                    // 取消收藏
                    $('#favoriteIcon').removeClass('fa-star').addClass('fa-star-o').css('color', '#666');
                    $('#favoriteText').text('收藏');
                    $('#favoriteBtn').css('border-color', '#ddd');
                } else {
                    // 收藏
                    $('#favoriteIcon').removeClass('fa-star-o').addClass('fa-star').css('color', '#f39c12');
                    $('#favoriteText').text('已收藏');
                    $('#favoriteBtn').css('border-color', '#f39c12');
                }
                
                layer.msg(result.msg, {icon: 1, time: 1500});
            } else {
                layer.msg(result.msg || '操作失败', {icon: 2, time: 2000});
            }
        }).fail(function() {
            layer.msg('网络错误，请稍后重试', {icon: 2, time: 2000});
        });
    });
    
    // 分享功能
    function shareArticle() {
        var title = '[[${article.title}]]';
        var url = window.location.href;
        
        if (navigator.share) {
            navigator.share({
                title: title,
                url: url
            });
        } else {
            // 复制链接到剪贴板
            var textArea = document.createElement("textarea");
            textArea.value = url;
            document.body.appendChild(textArea);
            textArea.select();
            document.execCommand('copy');
            document.body.removeChild(textArea);
            layer.msg('链接已复制到剪贴板', {icon: 1, time: 2000});
        }
    }
    
    // 图片缩放功能
    $('.post-content img').on('click', function(){
        var imgurl=$(this).attr('src');
        var w=this.width*2;
        var h=this.height*2+50;
        layer.open({
            type: 1,
            title: false, //不显示标题栏
            area: [w+"px", h+"px"],
            shadeClose: true, //点击遮罩关闭
            content: '\<\div style="padding:20px;">' +
                    '\<\img style="width:'+(w-50)+'px;" src='+imgurl+'\>\<\/div>'
        });
    });
</script>
</body>
</html>
