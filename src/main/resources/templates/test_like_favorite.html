<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>测试点赞收藏功能</title>
    <script th:src="@{/assets/js/jquery.min.js}"></script>
    <script th:src="@{/assets/js/layer.js}"></script>
</head>
<body>
    <h1>测试点赞收藏功能</h1>
    
    <div>
        <h3>测试文章ID: 1</h3>
        <button id="testLikeBtn">测试点赞</button>
        <button id="testFavoriteBtn">测试收藏</button>
        <button id="checkStatusBtn">检查状态</button>
    </div>
    
    <div id="result" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;">
        <h4>结果:</h4>
        <div id="resultContent"></div>
    </div>

    <script>
        var articleId = 1; // 测试用的文章ID
        
        // 测试点赞
        $('#testLikeBtn').click(function() {
            $.post('/test/like/' + articleId, function(result) {
                $('#resultContent').html('<p>点赞结果: ' + JSON.stringify(result) + '</p>');
                if (result && result.success) {
                    layer.msg(result.msg, {icon: 1, time: 2000});
                } else {
                    layer.msg(result.msg || '点赞失败', {icon: 2, time: 2000});
                }
            }).fail(function(xhr, status, error) {
                $('#resultContent').html('<p>点赞请求失败: ' + xhr.responseText + '</p>');
                layer.msg('网络错误', {icon: 2, time: 2000});
            });
        });
        
        // 测试收藏
        $('#testFavoriteBtn').click(function() {
            $.post('/test/favorite/' + articleId, function(result) {
                $('#resultContent').html('<p>收藏结果: ' + JSON.stringify(result) + '</p>');
                if (result && result.success) {
                    layer.msg(result.msg, {icon: 1, time: 2000});
                } else {
                    layer.msg(result.msg || '收藏失败', {icon: 2, time: 2000});
                }
            }).fail(function(xhr, status, error) {
                $('#resultContent').html('<p>收藏请求失败: ' + xhr.responseText + '</p>');
                layer.msg('网络错误', {icon: 2, time: 2000});
            });
        });
        
        // 检查状态
        $('#checkStatusBtn').click(function() {
            // 检查点赞状态
            $.get('/article/like/status/' + articleId, function(likeResult) {
                // 检查收藏状态
                $.get('/article/favorite/status/' + articleId, function(favoriteResult) {
                    $('#resultContent').html(
                        '<p>点赞状态: ' + JSON.stringify(likeResult) + '</p>' +
                        '<p>收藏状态: ' + JSON.stringify(favoriteResult) + '</p>'
                    );
                }).fail(function(xhr) {
                    $('#resultContent').html('<p>获取收藏状态失败: ' + xhr.responseText + '</p>');
                });
            }).fail(function(xhr) {
                $('#resultContent').html('<p>获取点赞状态失败: ' + xhr.responseText + '</p>');
            });
        });
        
        // 页面加载时检查状态
        $(document).ready(function() {
            $('#checkStatusBtn').click();
        });
    </script>
</body>
</html>
